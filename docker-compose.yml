services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scaff
      POSTGRES_USER: scaff
      POSTGRES_PASSWORD: scaff
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./migrations/002_add_run_results_unique.sql:/docker-entrypoint-initdb.d/02-migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaff -d scaff"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: "postgres://scaff:scaff@db:5432/scaff?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
